experiment_id: M1
experiment_name: convnext_image

seed: 42
validation_fold: 0

model:
  architecture: convnext_tiny
  pretrained: true
  weights: IMAGENET1K_V1
  use_metadata: false
  fine_tune_all: true
  num_outputs: 1

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false
  train_shuffle: true

transforms:
  resize_interpolation: bilinear
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: 15
  brightness: 0.10
  contrast: 0.10
  normalization_mean:
    - 0.485
    - 0.456
    - 0.406
  normalization_std:
    - 0.229
    - 0.224
    - 0.225

training:
  epochs: 10
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: weighted_bce
  scheduler: none
  amp: true
  early_stopping:
    enabled: true
    patience: 3

evaluation:
  threshold: 0.5
  checkpoint_metric: roc_auc
  checkpoint_mode: max

outputs:
  experiment_directory: logs/M1_convnext_image
  checkpoint: outputs/checkpoints/M1_convnext_image_best.pt
  predictions: outputs/predictions/M1_convnext_image.csv
  training_history: logs/M1_convnext_image/history.csv
  metrics: logs/M1_convnext_image/metrics.json
  environment: logs/M1_convnext_image/environment.json
  training_log: logs/M1_convnext_image/training.log
  training_curves: outputs/figures/M1_training_curves.png
  confusion_matrix: outputs/figures/M1_confusion_matrix.png
  roc_pr_curve: outputs/figures/M1_roc_pr.png
